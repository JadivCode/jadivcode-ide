name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get the JadivCode interpreter
        # A pull request here may depend on an interpreter change on a branch
        # of the same name; use that branch when it exists, otherwise main.
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          url=https://github.com/JadivCode/jadivcode
          if [ -n "$BRANCH" ] && git ls-remote --exit-code --heads "$url" "refs/heads/$BRANCH" >/dev/null 2>&1; then
            git clone --depth 1 --branch "$BRANCH" "$url" core
          else
            git clone --depth 1 "$url" core
          fi
          git -C core log -1 --oneline
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen
          JADIVCODE_HOME: ${{ github.workspace }}/core
